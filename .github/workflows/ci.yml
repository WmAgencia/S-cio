
name: Validar Sócio
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-application:
    # Follow the maintained GitHub runner image; fail the workflow if the
    # PostgreSQL integration suite cannot start, not merely if backup passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: socio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/socio_test
      SETUP_TOKEN: test_setup_token_000000000000000000000000000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The restore rehearsal talks to Postgres 16. Newer pg_dump can emit
      # PG18-only session settings, causing pg_restore to fail on PG16.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 && echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - run: pg_dump --version | grep -F 'PostgreSQL) 16.' && pg_restore --version | grep -F 'PostgreSQL) 16.'
      - run: npm ci --ignore-scripts --no-audit
      - run: node --check server.mjs && node --check lib.mjs && node --check public/app.js
      - run: node --check socio-owner-skill-readiness.mjs && node --check operational-readiness.mjs && node --check socio-conversation-memory.mjs && node --check socio-knowledge-retrieval.mjs
      - run: node --check sales-commerce.mjs && node --check sales-intents.mjs && node --check quote-requests.mjs && node --check tenant-features.mjs && node --check ai-replies.mjs && node --check public/sales.js && node --check public/quote.js
      - run: node --check team-permissions.mjs && node --check scripts/socio-encrypted-backup.mjs
      - run: node --check scripts/socio-supabase-migrate.mjs && node --check scripts/socio-provision-master.mjs && node --check scripts/socio-provision-railway-master.mjs
      - run: node --check waakg-socio/bootstrap.cjs && python3 -m py_compile waakg-socio/patch_readonly.py
      - run: node --check migration-guard.mjs && node --check scripts/socio-supabase-migrate.mjs
      - run: node --check instagram-integration.mjs && node --check marketing-integrations.mjs && node --check marketing-oauth.mjs && node --check instagram-hosted.mjs && node --check public/inbox.js && node --check public/app.js
      - name: Pipeboard hosted OAuth metadata (read-only diagnostic)
        continue-on-error: true
        timeout-minutes: 1
        run: node --input-type=module -e 'import {probePipeboardOAuth} from "./marketing-oauth.mjs"; for(const provider of ["meta"]){console.log(JSON.stringify({provider,...await probePipeboardOAuth(provider)}));}'
      - run: node --check meta-browser.mjs && node --check meta-browser/remote-worker.js && node --check meta-browser/remote-pool.js && node --check public/meta-browser-ui.js
      - run: node --check meta-local.mjs && node --check meta-connector/connector.mjs && node --check meta-connector/runtime.mjs && node --check meta-connector/protocol.mjs && node --check meta-connector/bundle.mjs && node --check public/meta-local-ui.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  backup-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backup-runner/Dockerfile -t socio-backup:ci .
      - run: docker run --rm --entrypoint /usr/local/bin/node socio-backup:ci --version
      - run: docker run --rm --entrypoint pg_dump socio-backup:ci --version | grep 'PostgreSQL) 18'
      - run: docker run --rm --entrypoint pg_restore socio-backup:ci --version | grep 'PostgreSQL) 18'
      - run: docker run --rm --entrypoint /usr/local/bin/node socio-backup:ci --check backup-runner/run.mjs
      - run: docker run --rm --entrypoint /usr/local/bin/node socio-backup:ci --check backup-runner/restore.mjs
      - run: docker run --rm --entrypoint /usr/local/bin/node socio-backup:ci --check backup-runner/media.mjs
      - run: docker run --rm --entrypoint /usr/local/bin/node socio-backup:ci --check backup-runner/mysql.mjs
      - run: docker run --rm --entrypoint mariadb-dump socio-backup:ci --version
